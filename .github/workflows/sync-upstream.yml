name: Sync Genesys Cloud Examples

on:
  workflow_dispatch:

  schedule:
    # Daily at 2am UTC
    - cron: "0 2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Clone upstream repository
        run: |
          git clone --depth 1 https://github.com/MyPureCloud/terraform-provider-genesyscloud.git upstream

      - name: Sync docs
        run: |
          mkdir -p docs
          rsync -av --delete \
            upstream/docs/ \
            docs/

      - name: Sync examples/common
        run: |
          mkdir -p examples/common
          rsync -av --delete \
            upstream/examples/common/ \
            examples/common/

      - name: Sync examples/data-sources
        run: |
          mkdir -p examples/data-sources
          rsync -av --delete \
            upstream/examples/data-sources/ \
            examples/data-sources/

      - name: Sync examples/provider
        run: |
          mkdir -p examples/provider
          rsync -av --delete \
            upstream/examples/provider/ \
            examples/provider/

      - name: Sync examples/resources
        run: |
          mkdir -p examples/resources
          rsync -av --delete \
            upstream/examples/resources/ \
            examples/resources/

      - name: Remove upstream clone
        run: rm -rf upstream

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Sync from terraform-provider-genesyscloud"

      - name: Push changes
        run: git push